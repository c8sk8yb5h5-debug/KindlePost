name: Build and Release KindlePost APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Validate and decode persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing Actions secret: $name. Add it under Settings > Secrets and variables > Actions > Repository secrets."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kindlepost-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/kindlepost-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_PATH=$RUNNER_TEMP/kindlepost-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle --no-daemon clean assembleRelease
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/kindlepost-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/KindlePost.apk
          sha256sum release-output/KindlePost.apk > release-output/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release-output/KindlePost.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KindlePost-${{ github.ref_type == 'tag' && github.ref_name || 'continuous' }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: KindlePost Continuous Build
          prerelease: true
          make_latest: false
          files: release-output/*
          fail_on_unmatched_files: true

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: KindlePost ${{ github.ref_name }}
          generate_release_notes: true
          files: release-output/*
          fail_on_unmatched_files: true
