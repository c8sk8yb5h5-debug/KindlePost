name: Build and Release KindlePost APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Build installable debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/KindlePost.apk
          sha256sum release-output/KindlePost.apk > release-output/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KindlePost-${{ github.ref_type == 'tag' && github.ref_name || 'continuous' }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: KindlePost Continuous Build
          prerelease: true
          make_latest: false
          files: release-output/*
          fail_on_unmatched_files: true

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: KindlePost ${{ github.ref_name }}
          generate_release_notes: true
          files: release-output/*
          fail_on_unmatched_files: true
